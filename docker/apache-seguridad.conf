# Endurecimiento de Apache para KusiMikuy (OWASP A05)
ServerName localhost
ServerTokens Prod
ServerSignature Off
TraceEnable Off

# Límites de conexión: protegen la memoria del contenedor ante un ataque de saturación
Timeout 30
KeepAlive On
KeepAliveTimeout 3
MaxKeepAliveRequests 50
LimitRequestBody 2097152
LimitRequestFields 50
LimitRequestFieldSize 8190
RequestReadTimeout header=10-20,MinRate=500 body=20,MinRate=500

# Pocos procesos: el plan gratuito de Render tiene 512 MB de memoria
<IfModule mpm_prefork_module>
    StartServers             2
    MinSpareServers          1
    MaxSpareServers          3
    MaxRequestWorkers       10
    MaxConnectionsPerChild 500
</IfModule>

<Directory /var/www/html/public>
    Options -Indexes -Includes
    AllowOverride All
    Require all granted
</Directory>

# Nunca servir archivos ocultos (.env, .git, etc.)
<FilesMatch "^\.">
    Require all denied
</FilesMatch>

<IfModule mod_headers.c>
    Header always unset X-Powered-By
</IfModule>